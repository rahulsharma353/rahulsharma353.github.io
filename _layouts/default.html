<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt_text | default: site.description | strip_html | strip }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
<div class="wrap">
  <header class="sans">
    <a class="logo" href="{{ '/' | relative_url }}">
      <div class="mark">PM</div>
      <h1>PM in the <span>Loop</span></h1>
    </a>
    <div class="tagline">{{ site.description }}</div>
    <nav>
      <a href="{{ '/' | relative_url }}" class="{% if page.url == '/' %}active{% endif %}">Posts</a>
    </nav>
  </header>
  <main>
    {{ content }}
  </main>
  <footer class="sans">PM in the Loop — built one week at a time.</footer>
</div>
</body>
</html>
